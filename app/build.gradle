plugins {
    id 'com.android.application'
}

android {
    namespace 'org.guysoft.blackbox'
    compileSdk 35
    buildToolsVersion '35.0.0'
    signingConfigs {
        debug {
            if (System.getenv('BLACKBOX_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('BLACKBOX_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig {
        applicationId 'org.guysoft.blackbox'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
